server:
  port: 8087
  
spring:
  application:
    name: API_GATEWAY
    
    
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200" # or "*" to allow all origins
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*" # or specify headers
            allowCredentials: true
      routes:
      - id: UserMS
        uri:
          lb://UserMS
        predicates:
        - Path=/user/**


      - id: gestionAuth
        uri:
          lb://gestionAuth
        predicates:
          - Path=/auth/**
        


