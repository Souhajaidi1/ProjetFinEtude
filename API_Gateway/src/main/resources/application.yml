server:
    port: 8087
  
spring:
  application:
    name: API_GATEWAY
    
    
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
      - id: UserMS
        uri:
          lb://UserMS
        predicates:
        - Path=/user/**


      - id: offerMS
        uri:
          lb://offers
        predicates:
          - Path=/offers/**
        


