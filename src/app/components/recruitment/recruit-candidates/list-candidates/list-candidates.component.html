<h1>Candidates Management / List Candidates</h1>

<div class="example-container mat-elevation-z8">
  <div class="filter-container">
    <mat-form-field appearance="outline" class="filter-form-field">
      <mat-label>Filter candidates</mat-label>
      <input matInput (keyup)="applyFilter()" [(ngModel)]="resourceName" placeholder="Type to filter candidates" />
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="resetFilters()">Reset Filters</button>
  </div>
  <nav class="navbar navbar-light bg-faded m-b-10 p-10">
    <div class="col-sm-4">
      <button type="button" class="export btn btn-sm btn-primary m-r-10">
        <em class="fa fa-file-excel-o"></em> Export
      </button>
    </div>
    <div class="col-sm-8">
      <mat-paginator [length]="dataSource.data.length"
        [pageSize]="10"
        [pageSizeOptions]="[5, 10, 20]"
        showFirstLastButtons
        (page)="onPageChange()">
      </mat-paginator>
    </div>
  </nav>

  <table mat-table [dataSource]="dataSource" matSort (matSortChange)="onSortData($event)" class="mat-elevation-z8 full-width-table">
    <!-- Reference Column -->
    <ng-container matColumnDef="refapplication">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Reference</th>
      <td mat-cell *matCellDef="let candidates">{{candidates.refapplication}}</td>
    </ng-container>

    <!-- CV Column -->
    <ng-container matColumnDef="cv">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>CV</th>
      <td mat-cell *matCellDef="let candidates">{{candidates.cv}}</td>
    </ng-container>

    <!-- Motivation Letter Column -->
    <ng-container matColumnDef="motivationletter">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Motivation Letter</th>
      <td mat-cell *matCellDef="let candidates">{{candidates.motivationletter}}</td>
    </ng-container>

    <!-- Date Application Column -->
    <ng-container matColumnDef="dateApplication">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Candidate Date</th>
      <td mat-cell *matCellDef="let candidates">{{candidates.dateApplication | date}}</td>
    </ng-container>

    <!-- Score Column -->
    <ng-container matColumnDef="score">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Score</th>
      <td mat-cell *matCellDef="let candidates">{{candidates.score}}</td>
    </ng-container>

    <!-- Action Column -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>Action</th>
      <td mat-cell *matCellDef="let candidates">
        <button class="btn btn-mini btn-primary m-r-5 ripple light" type="button"
           matTooltip="Edit" (click)="editcandidate(candidates)">
          <em class="material-icons">edit</em>
        </button>
        <button class="btn btn-mini btn-danger ripple light" type="button" matTooltip="Delete"
          (click)="deletecandidate(candidates)">
          <em class="material-icons">delete</em>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
