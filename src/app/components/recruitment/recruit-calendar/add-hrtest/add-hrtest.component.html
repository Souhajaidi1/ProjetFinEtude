<h1 mat-dialog-title>HR Interview</h1>

<div mat-dialog-content>
  <form [formGroup]="hrTest">
    <mat-form-field>
      <input matInput formControlName="date" [matDatepicker]="picker" placeholder="Interview Date">
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-form-field>
      <input matInput formControlName="Hour" placeholder="Hour" type="time">
    </mat-form-field>

    <mat-form-field>
      <input matInput formControlName="duration" placeholder="Duration" type="number">
    </mat-form-field>

    <mat-form-field>
      <mat-select formControlName="type" placeholder="Type">
        <mat-option value="online">Online</mat-option>
        <mat-option value="in-person">In Person</mat-option>
      </mat-select>
    </mat-form-field>
  </form>
</div>

<div mat-dialog-actions>
  <button mat-button (click)="onNoClick()">Cancel</button>
  <button mat-button (click)="onSave()">Save</button>
</div>
