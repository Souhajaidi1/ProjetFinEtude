<h1 mat-dialog-title>HR Interview</h1>

<div mat-dialog-content>
  <form [formGroup]="hrTest">
    <mat-form-field>
      <input matInput formControlName="interviewdate" [matDatepicker]="picker" placeholder="Interview Date" [(ngModel)]="interviewdate">
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-form-field>
      <input matInput formControlName="hour" placeholder="Hour" type="time" [(ngModel)]="hour">
    </mat-form-field>

    <mat-form-field>
      <input matInput formControlName="duration" placeholder="duration" type="number" [(ngModel)]="duration">
    </mat-form-field>

    <mat-form-field>
      <mat-select formControlName="type" placeholder="Type" [(ngModel)]="modality">
        <mat-option value="online">Online</mat-option>
        <mat-option value="in-person">On site</mat-option>
      </mat-select>
    </mat-form-field>
  </form>
</div>

<div mat-dialog-actions>
  <button mat-button (click)="onNoClick()">Cancel</button>
  <button mat-button (click)="onSave()">Save</button>
</div>
