<h1>Human Resources Interviews</h1>
<div class="example-container mat-elevation-z8">
  <div class="filter-container">
    <mat-form-field appearance="outline" class="filter-form-field">
      <mat-label>Filter HR Tests</mat-label>
      <input matInput (keyup)="applyFilter()" [(ngModel)]="resourceName" placeholder="Type to filter HR tests" />
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="resetFilters()">Reset Filters</button>
  </div>
  <nav class="navbar navbar-light bg-faded m-b-10 p-10">
    <div class="col-sm-4">
      <button type="button" class="export btn btn-sm btn-primary m-r-10">
        <em class="fa fa-file-excel-o"></em> Export
      </button>
    </div>
    <div class="col-sm-8">
      <mat-paginator [length]="dataSource.data.length"
        [pageSize]="10"
        [pageSizeOptions]="[5, 10, 20]"
        showFirstLastButtons
        (page)="onPageChange()">
      </mat-paginator>
    </div>
  </nav>

  <table mat-table [dataSource]="dataSource" matSort (matSortChange)="onSortData($event)" class="mat-elevation-z8 full-width-table">
    <!-- ID Test HR Column -->
    <ng-container matColumnDef="idTestHR">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID Test HR</th>
      <td mat-cell *matCellDef="let testHR">{{testHR.idTestHR}}</td>
    </ng-container>

    <!-- Interview Date Column -->
    <ng-container matColumnDef="interviewdate">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Interview Date</th>
      <td mat-cell *matCellDef="let testHR">{{testHR.interviewdate | date}}</td>
    </ng-container>

    <!-- Hour Column -->
    <ng-container matColumnDef="hour">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Hour</th>
      <td mat-cell *matCellDef="let testHR">{{testHR.hour}}</td>
    </ng-container>

    <!-- Duration Column -->
    <ng-container matColumnDef="duration">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Duration</th>
      <td mat-cell *matCellDef="let testHR">{{testHR.duration}}</td>
    </ng-container>

    <!-- Type Column -->
    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Type</th>
      <td mat-cell *matCellDef="let testHR">{{testHR.type}}</td>
    </ng-container>

    <!-- Action Column -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let testHR">
        <button class="btn btn-mini btn-primary m-r-5 ripple light" type="button"
           matTooltip="Edit" (click)="editTestHR(testHR)">
          <em class="material-icons">edit</em>
        </button>
        <button class="btn btn-mini btn-danger ripple light" type="button" matTooltip="Delete"
          (click)="deleteTestHR(testHR)">
          <em class="material-icons">delete</em>
        </button>
      </td>
    </ng-container>
     <!-- Evaluate Column -->
    <ng-container matColumnDef="Evaluate">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Evaluate</th>
      <td mat-cell *matCellDef="let testHR">
        <button class="btn btn-mini btn-primary m-r-5 ripple light" type="button"
        matTooltip="Evaluate" (click)="editTestHR(testHR)">
       <em class="material-icons">edit</em>
     </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
