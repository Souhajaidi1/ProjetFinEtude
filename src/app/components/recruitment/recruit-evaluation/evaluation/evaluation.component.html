<div class="container">
  <h1>Evaluation Form</h1>
  <form [formGroup]="evaluationForm" (ngSubmit)="onSubmit()">
    <div class="table-responsive">
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Competence</th>
            <th>Question</th>
            <th>Score</th>
            <th>Remark</th>
          </tr>
        </thead>
        <tbody>
          <!-- Soft Skills Section -->
          <ng-container *ngFor="let question of softSkillsQuestions; let i = index">
            <tr>
              <td class="competence-cell soft-skill-cell" [class.first-row]="i === 0" [class.last-row]="i === softSkillsQuestions.length - 1">Soft Skill</td>
              <td>{{ question.text }}</td>
              <td>
                <input
                  type="range"
                  class="form-range"
                  min="1"
                  max="5"
                  [formControlName]="question.controlName"
                />
                <span>{{ evaluationForm.controls[question.controlName].value }}</span>
              </td>
              <td>
                <input type="text" class="form-control" [formControlName]="'remark' + question.id" />
              </td>
            </tr>
          </ng-container>

          <!-- Hard Skills Section -->
          <ng-container *ngFor="let question of hardSkillsQuestions; let i = index">
            <tr>
              <td class="competence-cell hard-skill-cell" [class.first-row]="i === 0" [class.last-row]="i === hardSkillsQuestions.length - 1">Hard Skill</td>
              <td>{{ question.text }}</td>
              <td>
                <input
                  type="range"
                  class="form-range"
                  min="1"
                  max="5"
                  [formControlName]="question.controlName"
                />
                <span>{{ evaluationForm.controls[question.controlName].value }}</span>
              </td>
              <td>
                <input type="text" class="form-control" [formControlName]="'remark' + question.id" />
              </td>
            </tr>
          </ng-container>
        </tbody>
      </table>
    </div>

    <!-- Submit Button -->
    <div class="text-center mt-4">
      <button type="submit" class="btn btn-primary" [disabled]="!evaluationForm.valid">Submit</button>
    </div>
  </form>
</div>
