
<h1>Offer Management / List Offers</h1>

<table class="table table-striped">
  <thead>
    <tr>
      <th>Title</th>
      <th>Candidate</th>
      <th>Position</th>
      <th>Status</th> </tr>
  </thead>
  <tbody>
    <tr *ngFor="let offer of offers">
      <td>{{ offer.title }}</td>
      <td>{{ offer.candidate }}</td>
      <td>{{ offer.position }}</td>
      <td *ngIf="offer.status">{{ offer.status }}</td> </tr>
  </tbody>
</table>
